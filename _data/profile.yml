bio_paragraphs:
- >-
  I am a **Postdoctoral Researcher** in the [School of Civil and Environmental
  Engineering](https://ce.gatech.edu/) at the [Georgia Institute of
  Technology](https://www.gatech.edu/), working with
  [Prof. Srinivas Peeta](https://peeta.ce.gatech.edu/).
  Previously, I was a short-term visiting scholar at Georgia Tech.
- >-
  I received my **Ph.D. in Transportation** from [Zhejiang
  University](https://www.zju.edu.cn/english/) in June 2026, advised by
  [Prof. Sheng Jin](https://person.zju.edu.cn/en/jinsheng). I am also a
  Ph.D. candidate in Intelligent Transportation at [The Hong Kong Polytechnic
  University](https://www.polyu.edu.hk/) through a dual-degree Ph.D. program,
  advised by [Prof. Min Xu](https://www.polyu.edu.hk/ise/people/academic-staff/min-xu/).
- >-
  My research aims to make autonomous transportation systems **safe, interactive,
  and trustworthy**. I study transportation safety and driving behavior,
  interactive multi-agent prediction and planning, and learning-based autonomous
  driving, with an emphasis on trustworthy AI and multimodal foundation models.
bio: I am a Postdoctoral Researcher in the School of Civil and Environmental Engineering at the Georgia Institute
  of Technology, working with Prof. Srinivas Peeta. I received my Ph.D. in Transportation from Zhejiang University
  in June 2026 and am a Ph.D. candidate in Intelligent Transportation at The Hong Kong Polytechnic University
  through a dual-degree Ph.D. program. My research focuses on safe, interactive, and trustworthy autonomous transportation
  systems, including traffic safety and driving behavior, multi-agent prediction and planning, and learning-based
  autonomous driving.
research_interests:
- Safe and intelligent autonomous transportation systems
- Transportation safety and driving behavior
- Multi-agent prediction and planning
- End-to-end autonomous driving
- Trustworthy AI and multimodal foundation models for transportation
